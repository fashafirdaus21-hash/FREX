<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPPI Library - Login Portal</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-6 bg-gray-200">

    <!-- Container Utama -->
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- SISI KIRI: Banner -->
        <div class="w-full md:w-1/2 relative bg-[#0c2340] min-h-[300px] md:min-h-full">
            <img src="{{ url_for('static', filename='banner-kiri.png') }}" alt="Banner Login" class="w-full h-full object-cover">
        </div>

        <!-- SISI KANAN: Form Login (Posisi di Tengah) -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-white">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight mb-2">Login</h2>
                <p class="text-xs md:text-sm text-gray-500 font-medium">Enter your credentials to access your account</p>
            </div>

            <!-- Form Login -->
            <form action="/login" method="POST" class="space-y-4">
                
                <!-- Input Username / ID -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1">Username / ID</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-gray-400">👤</span>
                        <input type="text" name="username" placeholder="Masukkan username / ID..." required
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 text-gray-800 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1">Password</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-gray-400">🔒</span>
                        <input type="password" name="password" placeholder="********" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 text-gray-800 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>

                <!-- Tombol Login -->
                <button type="submit" class="w-full py-3.5 mt-4 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl shadow-md text-sm cursor-pointer transition">
                    Login
                </button>
            </form>

            <!-- Tautan ke Sign Up -->
            <div class="text-center mt-8 text-xs text-gray-500 font-medium">
                Don't have an account?<br>
                <a href="/signup" class="text-black font-black text-sm underline decoration-2 underline-offset-4 hover:text-blue-900">
                    Sign up
                </a>
            </div>

        </div>

    </div>

</body>
</html>
