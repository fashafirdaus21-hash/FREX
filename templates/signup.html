<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YPPI Library - Registration Portal</title>
    <!-- Tailwind CSS v3 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="flex items-center justify-center min-h-screen p-4 md:p-6 bg-gray-200 relative">

    <!-- POP-UP NOTIFIKASI DI BAGIAN ATAS HALAMAN (SILANG MERAH) -->
    <div id="notifError" class="hidden fixed top-5 left-1/2 -translate-x-1/2 z-50 w-[92%] max-w-md bg-white border-l-4 border-red-500 shadow-2xl rounded-2xl px-4 py-3.5 flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-red-100 text-red-600 flex items-center justify-center font-black text-base shrink-0">
            ✕
        </div>
        <div class="flex-1 text-left">
            <p id="notifErrorPesan" class="text-xs md:text-sm font-extrabold text-gray-900">
                Akun sudah terdaftar, ganti yang lain.
            </p>
        </div>
        <button type="button" onclick="tutupNotif('notifError')" class="text-gray-400 hover:text-gray-700 font-bold text-sm px-1 cursor-pointer">
            ✕
        </button>
    </div>

    <!-- Container Utama -->
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row">
        
        <!-- SISI KIRI: Banner -->
        <div class="w-full md:w-1/2 relative bg-[#0c2340] min-h-[300px] md:min-h-full">
            <img src="{{ url_for('static', filename='banner-regist.jpg') }}" alt="Banner Registration" class="w-full h-full object-cover">
        </div>

        <!-- SISI KANAN: Form Registrasi (Posisi di Tengah) -->
        <div class="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center bg-white">
            
            <div class="text-center mb-8">
                <h2 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight mb-2">Registration</h2>
                <p class="text-xs md:text-sm text-gray-500 font-medium">Create your account to start exploring</p>
            </div>

            <!-- Form Registrasi -->
            <form action="/signup" method="POST" class="space-y-4">
                
                <!-- Input Username -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1">Username</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-gray-400">👤</span>
                        <input type="text" name="username" placeholder="Enter your username" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 text-gray-800 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>

                <!-- Input Email -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1">Email Address</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-gray-400">✉️</span>
                        <input type="email" name="email" placeholder="you@gmail.com" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 text-gray-800 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>

                <!-- Input Password -->
                <div>
                    <label class="block text-xs font-bold text-gray-800 mb-1">Password</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-3.5 text-gray-400">🔒</span>
                        <input type="password" name="password" placeholder="********" required
                            class="w-full pl-10 pr-4 py-3 bg-gray-100 text-gray-800 rounded-xl text-xs font-medium focus:outline-none focus:ring-2 focus:ring-yellow-400">
                    </div>
                </div>

                <!-- Tombol Register -->
                <button type="submit" class="w-full py-3.5 mt-4 bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-extrabold rounded-xl shadow-md text-sm cursor-pointer transition">
                    Register
                </button>
            </form>

            <!-- Tautan ke Login -->
            <div class="text-center mt-8 text-xs text-gray-500 font-medium">
                Already have an account?<br>
                <a href="/" class="text-black font-black text-sm underline decoration-2 underline-offset-4 hover:text-blue-900">
                    Login
                </a>
            </div>

        </div>

    </div>

    <script>
        function tutupNotif(id) {
            const el = document.getElementById(id);
            if (el) el.classList.add("hidden");
        }

        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const status = params.get("status");
            const pesanEl = document.getElementById("notifErrorPesan");
            const notifEl = document.getElementById("notifError");

            if (status === "duplikat") {
                if (pesanEl) pesanEl.textContent = "Akun sudah terdaftar, ganti yang lain.";
                if (notifEl) notifEl.classList.remove("hidden");
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (status === "kosong") {
                if (pesanEl) pesanEl.textContent = "Silakan lengkapi data pendaftaran terlebih dahulu.";
                if (notifEl) notifEl.classList.remove("hidden");
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
