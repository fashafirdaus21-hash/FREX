<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Lingkaran Luar Ornamen Hexagon Halus -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#facc15" stroke-width="1.5" stroke-opacity="0.6" stroke-dasharray="4 4"/>

  <!-- Perisai Luar (Biru Tua) -->
  <path d="M 200 35 L 330 80 L 330 210 C 330 280 200 355 200 355 C 200 355 70 280 70 210 L 70 80 Z" fill="#0c2340" stroke="#facc15" stroke-width="6"/>

  <!-- Garis Pinggir Dalam Perisai -->
  <path d="M 200 45 L 318 87 L 318 205 C 318 268 200 338 200 338 C 200 338 82 268 82 205 L 82 87 Z" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.8"/>

  <!-- Tangkai Padi Kiri & Kanan -->
  <path d="M 100 130 Q 70 180 95 240" fill="none" stroke="#facc15" stroke-width="4"/>
  <circle cx="95" cy="130" r="8" fill="#facc15"/><circle cx="82" cy="150" r="8" fill="#facc15"/><circle cx="75" cy="175" r="8" fill="#facc15"/><circle cx="78" cy="200" r="8" fill="#facc15"/><circle cx="90" cy="225" r="8" fill="#facc15"/>

  <path d="M 300 130 Q 330 180 305 240" fill="none" stroke="#facc15" stroke-width="4"/>
  <circle cx="305" cy="130" r="8" fill="#facc15"/><circle cx="318" cy="150" r="8" fill="#facc15"/><circle cx="325" cy="175" r="8" fill="#facc15"/><circle cx="322" cy="200" r="8" fill="#facc15"/><circle cx="310" cy="225" r="8" fill="#facc15"/>

  <!-- Bintang Emas Atas -->
  <polygon points="200,65 205,82 224,82 209,92 215,110 200,99 185,110 191,92 176,82 195,82" fill="#facc15" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Buku Terbuka Putih -->
  <g transform="translate(130, 115)">
    <path d="M 0 20 C 25 10 70 20 70 20 L 70 85 C 70 85 30 75 0 85 Z" fill="#ffffff" stroke="#0c2340" stroke-width="2"/>
    <path d="M 70 20 C 70 20 115 10 140 20 L 140 85 C 140 85 105 75 70 85 Z" fill="#ffffff" stroke="#0c2340" stroke-width="2"/>
    <line x1="70" y1="20" x2="70" y2="85" stroke="#0c2340" stroke-width="3"/>
  </g>

  <!-- Pita Kuning "YPPI" -->
  <path d="M 95 215 L 305 215 L 290 255 L 110 255 Z" fill="#facc15" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
  <text x="200" y="246" font-family="'Poppins', sans-serif" font-size="32" font-weight="900" fill="#0c2340" text-anchor="middle" letter-spacing="4">YPPI</text>

  <!-- Pita Bawah "SMK AL-IKHLAS" -->
  <path d="M 120 262 L 280 262 L 275 295 L 125 295 Z" fill="#ffffff" stroke="#0c2340" stroke-width="2" stroke-linejoin="round"/>
  <text x="200" y="286" font-family="'Poppins', sans-serif" font-size="14" font-weight="800" fill="#0c2340" text-anchor="middle" letter-spacing="2">SMK AL-IKHLAS</text>
</svg>
